services:
  devpi:
    image: ghcr.io/jiangood/devpi:latest
    container_name: devpi
    ports:
      - "7104:7104"
    volumes:
      - ./data:/var/lib/devpi
    # 可选：更换上游源 / 调整请求超时（秒）/ 设置 root 密码 / 禁用 NVIDIA 源
    # environment:
    #   MIRROR_URL: https://mirrors.aliyun.com/pypi/simple
    #   NVIDIA_MIRROR_URL: https://pypi.nvidia.cn
    #   REQUEST_TIMEOUT: "120"
    #   ROOT_PASSWORD: change-me
